# Blueprint do Render (opcional): cria o banco e o serviço web.
databases:
  - name: fiscofacil-db
    plan: free
    region: oregon
services:
  - type: web
    name: fiscofacil
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fiscofacil-db
          property: connectionString
