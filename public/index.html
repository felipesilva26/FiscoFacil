<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1847">
<meta name="description" content="Acompanhe a situação fiscal, os vencimentos e as guias das suas empresas.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='7' fill='%230F1847'/%3E%3Crect x='6' y='16' width='4.5' height='8' rx='1.2' fill='%237FA2FF'/%3E%3Crect x='12.75' y='11' width='4.5' height='13' rx='1.2' fill='%235B8CFF'/%3E%3Crect x='19.5' y='6' width='4.5' height='18' rx='1.2' fill='%232F5BEA'/%3E%3C/svg%3E">
<title>FiscoFácil</title>
<style>
/* Layout: menu lateral escuro + coluna de conteúdo em cartões; no celular o menu vira barra inferior (container query). */
/* Tema único claro, fiel à referência: menu azul-marinho, fundo claro azulado, ações em roxo, links em azul. */
:root{
  --bg:#F3F5FC; --card:#FFFFFF; --ink:#1A2040; --muted:#5F6787; --line:#E5E8F3; --soft:#F1F3FA;
  --brand:#5B3FE4; --brand-text:#4E33D8; --brand-soft:#EFEBFF; --btn:#5B3FE4; --btn-ink:#FFFFFF;
  --blue:#2B63F6; --blue-soft:#E7EEFF;
  --side:#0F1847; --side-ink:#C8CEEE; --side-hover:#1B2562; --side-active:#2F5BEA; --side-strong:#FFFFFF;
  --ok:#15803D; --ok-dot:#22C55E; --ok-bg:#E4F7EB;
  --warn:#C2410C; --warn-dot:#F59E0B; --warn-bg:#FFF1E0;
  --bad:#C81E1E; --bad-dot:#EF4444; --bad-bg:#FDECEC;
  --violet-bg:#EFEBFF; --violet:#6D4AF0;
  --promo-a:#F3EFFF; --promo-b:#E8EEFF; --promo-line:#E2DCFF; --pill:#E9ECF8; --me:#E4DDFF; --today-bg:#FFEADB; --avatar:#1E2B7A;
  --shadow:0 1px 2px rgba(26,32,64,.04),0 8px 24px rgba(40,52,120,.07);
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-head:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none}

.frame{container-type:inline-size;container-name:app;min-height:100vh;background:var(--bg)}
body.phone .frame{width:390px;max-width:100%;height:min(840px,calc(100vh - 48px));min-height:0;margin:24px auto;overflow:auto;border:10px solid #101426;border-radius:40px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
body.phone .app{min-height:100%}

.side{background:var(--side);color:var(--side-ink);padding:22px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font:700 20px var(--f-head);color:var(--side-strong);padding:0 8px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:var(--side-ink);text-decoration:none;font-weight:600}
.nav a:hover{background:var(--side-hover)}
.nav a[aria-current="page"]{background:var(--side-active);color:var(--side-strong)}
.sidestatus{margin-top:auto;background:var(--side-hover);border-radius:14px;padding:14px;font-size:13px;display:flex;gap:10px;align-items:flex-start;color:var(--side-strong)}
.sidestatus small{display:block;color:var(--side-ink);margin-top:2px}
.sidestatus .good{color:#4ADE80}.sidestatus .badc{color:#FF8A80}

.col{padding-top:20px;padding-bottom:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:20px}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:relative}
.search{flex:1 1 240px;position:relative;min-width:0}
.search .ic{position:absolute;left:14px;top:12px;color:var(--muted)}
.search input{padding-left:42px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.in{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);width:100%;min-width:0}
.tools .in{width:auto;font-weight:600}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;position:relative}
.ib[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-text)}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.avatar{width:44px;height:44px;border-radius:22px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-weight:700;text-decoration:none}
.pop{position:absolute;right:0;top:54px;width:min(360px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow),0 18px 40px rgba(0,0,0,.18);padding:12px;z-index:30;display:flex;flex-direction:column;gap:4px}
.pop h2{font-size:14px;padding:4px 8px}
.pop button{text-align:left;background:none;border:0;border-radius:10px;padding:10px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.pop button:hover{background:var(--brand-soft)}
.pop .none{padding:10px;color:var(--muted)}

.pagehead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{font:700 28px/1.2 var(--f-head);text-wrap:balance}
.sub{color:var(--muted);margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;min-width:0}
.chead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.chead h2{font:700 17px var(--f-head)}
.link{color:var(--brand-text);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:4px;min-height:32px}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--ink);font-weight:600;cursor:pointer;text-align:left}
.linkbtn:hover{color:var(--brand-text);text-decoration:underline}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{display:flex;gap:14px;align-items:center}
.kicon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none}
.kicon.brand{background:var(--brand-soft);color:var(--brand-text)}
.kicon.bad{background:var(--bad-bg);color:var(--bad)}
.kicon.ok{background:var(--ok-bg);color:var(--ok)}
.kicon.violet{background:var(--violet-bg);color:var(--violet)}
.klabel{font-weight:600}
.ksub{font-size:12px;color:var(--muted)}
.kval{font:700 24px var(--f-head);font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}

.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.tablewrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl.wide{min-width:620px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;white-space:nowrap}
.tbl td{padding:12px 10px;border-top:1px solid var(--line);vertical-align:middle}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;gap:6px;align-items:center;justify-content:flex-end}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.pago{color:var(--ok);background:var(--ok-bg)}
.chip.avencer{color:var(--warn);background:var(--warn-bg)}
.chip.atrasado{color:var(--bad);background:var(--bad-bg)}
.chip.neutro{color:var(--muted);background:var(--brand-soft)}

.btn{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--btn);color:var(--btn-ink)}
.btn.ghost{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn.soft{background:var(--brand-soft);color:var(--brand-text)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{min-height:40px;padding:0 12px;font-size:13px}
.sr:focus-visible + .btn{outline:2px solid var(--brand-text);outline-offset:2px}

.dlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.dlist li{display:flex;gap:14px;align-items:center}
.dbadge{width:52px;height:52px;border-radius:14px;background:var(--brand-soft);color:var(--brand-text);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;letter-spacing:.04em;flex:none}
.dbadge b{font:700 18px/1 var(--f-head)}
.dbadge.bad{background:var(--bad-bg);color:var(--bad)}
.dlist .b{font-weight:600}.dlist .m{color:var(--muted);font-size:13px}

.promo{background:var(--brand-soft);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.promo .bot{width:72px;height:72px;border-radius:20px;background:var(--card);color:var(--brand-text);display:grid;place-items:center;flex:none}
.promo p{max-width:46ch}
.promo h2{font:700 17px var(--f-head);margin-bottom:4px}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{stroke:var(--brand);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--brand-soft)}
.chart .pt{fill:var(--card);stroke:var(--brand);stroke-width:2}
.chart .pt.last{fill:var(--brand)}
.chart .tip{fill:var(--btn)}
.chart .tiptx{fill:var(--btn-ink);font-weight:700;font-size:11px}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--brand-soft);color:var(--brand-text);border-color:transparent}
.toolrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
.toolrow .in{width:auto;min-width:180px}
.empty{padding:28px 12px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:6px 0}
.day{min-height:84px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:6px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;cursor:pointer;text-align:left;min-width:0}
.day.out{color:var(--muted);background:transparent}
.day.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.dn{min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:700}
.day.today .dn{background:var(--btn);color:var(--btn-ink)}
.evts{display:flex;flex-wrap:wrap;gap:3px;max-width:100%}
.evt{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evt.pago{color:var(--ok);background:var(--ok-bg)}
.evt.avencer{color:var(--warn);background:var(--warn-bg)}
.evt.atrasado{color:var(--bad);background:var(--bad-bg)}
.more{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:12px}
.dayitem{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.dayitem:first-of-type{border-top:0}

.chat{display:flex;flex-direction:column;gap:10px;max-height:min(52vh,480px);overflow:auto;padding:4px 2px 12px}
.msg{max-width:min(560px,90%);padding:10px 14px;border-radius:14px;white-space:pre-line;line-height:1.5}
.msg.bot{background:var(--brand-soft);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--btn);color:var(--btn-ink);align-self:flex-end;border-bottom-right-radius:4px}
.sugs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.sugs button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;color:var(--brand-text)}
.sendrow{display:flex;gap:8px}

.bars{display:flex;flex-direction:column;gap:14px}
.barrow{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;align-items:center}
.bar{height:10px;border-radius:5px;background:var(--brand-soft)}
.bar i{display:block;height:100%;border-radius:5px;background:var(--brand)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

.docrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.docrow:first-child{border-top:0}
.docicon{width:40px;height:40px;border-radius:10px;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;flex:none}
.docrow .grow{flex:1 1 200px;min-width:0}
.docrow .nm{font-weight:600;overflow-wrap:anywhere}
.docrow .mt{color:var(--muted);font-size:12px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);margin-bottom:14px}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}

.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lb{font-weight:600;font-size:13px}
.hint{color:var(--muted);font-size:12px}
.err{color:var(--bad);font-weight:600;min-height:0}
.formrow{display:flex;gap:12px;flex-wrap:wrap}
.formrow .field{flex:1 1 180px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.checks{display:flex;flex-direction:column;gap:2px}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--brand)}
.cfggrid{display:flex;flex-direction:column;gap:20px;max-width:820px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.note{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600}

.overlay{position:fixed;inset:0;background:rgba(10,14,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dialog{background:var(--card);color:var(--ink);border-radius:20px;width:100%;max-width:500px;max-height:calc(100vh - 32px);overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mhead h2{font:700 19px var(--f-head)}
.sheetlinks{display:flex;flex-direction:column;gap:6px}
.sheetlinks a{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600;background:var(--brand-soft)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:60;font-weight:600;max-width:calc(100% - 32px);text-align:center}

.tabbar{display:none;position:sticky;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar a,.tabbar button{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;background:none;border:0;cursor:pointer;border-radius:12px}
.tabbar [aria-current="page"]{color:var(--brand-text)}

@container app (max-width:1040px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@container app (min-width:881px){
  .col{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
}
@container app (max-width:880px){
  .app{display:flex;flex-direction:column}
  .side{display:none}
  .col{flex:1}
  .tabbar{display:flex}
  h1{font-size:24px}
}
@container app (max-width:700px){
  .hide-n{display:none}
  .stats3{grid-template-columns:minmax(0,1fr)}
  .barrow{grid-template-columns:90px minmax(0,1fr) auto}
  .day{min-height:54px;padding:4px;align-items:center}
  .evt.pago,.evt.avencer,.evt.atrasado{font-size:0;width:8px;height:8px;padding:0;border-radius:50%;background:currentColor}
  .more{display:none}
  .kv{grid-template-columns:minmax(0,1fr)}
}
@container app (max-width:560px){
  .kpi{flex-direction:column;align-items:flex-start;gap:10px}
  .kval{font-size:20px}
  .card{padding:16px}
}
@media (max-width:880px){
  #phoneBtn{display:none}
  #toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:600px){
  .overlay{align-items:flex-end;padding:0}
  .dialog{border-bottom-left-radius:0;border-bottom-right-radius:0;max-height:92vh}
}
/* Acabamentos da referência */
.brand{font:700 21px var(--f-head)}
.nav a{border-radius:10px;font-weight:500}
.nav a[aria-current="page"]{background:var(--side-active);font-weight:600}
.sidestatus{border:1px solid rgba(255,255,255,.06)}
.search input{border-radius:14px}
.avatar{background:var(--avatar);color:#FFFFFF}
.link{color:var(--blue)}
.kicon{width:52px;height:52px;border-radius:14px}
.kicon.brand{background:var(--blue-soft);color:var(--blue)}
.kicon.bad{background:var(--bad-bg);color:var(--bad-dot)}
.kicon.ok{background:var(--ok-bg);color:var(--ok-dot)}
.kicon.violet{background:var(--violet-bg);color:var(--violet)}
.kval.bad{color:var(--bad)}
.kval.ok{color:var(--ok)}
.chip{font-weight:600}
.chip.pago i{background:var(--ok-dot)}
.chip.avencer i{background:var(--warn-dot)}
.chip.atrasado i{background:var(--bad-dot)}
.chip.soon{color:var(--bad);background:var(--bad-bg)}
.chip.later{color:var(--warn);background:var(--warn-bg)}
.tbl th{color:var(--ink);font-weight:700}
.dbadge{width:46px;height:46px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-size:9px}
.dbadge b{font-size:17px}
.dbadge.bad{background:var(--bad-bg);color:var(--bad)}
.dlist li{gap:10px}
.dlist .grow{flex:1;min-width:0}
.arw{color:var(--blue);display:flex}
.promo{background:linear-gradient(115deg,var(--promo-a),var(--promo-b));border-color:var(--promo-line)}
.promo .grow{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--brand-text);font-weight:700;font-size:14px;padding:5px 12px;border-radius:999px}
.pillbtn{border-radius:999px}
.promo .bot{background:var(--card);color:var(--brand)}
.tabs button[aria-selected="true"]{background:var(--blue-soft);color:var(--blue)}
.day.sel{border-color:var(--brand);box-shadow:none}
.day.today .dn{background:var(--today-bg);color:var(--warn)}
.day.sel .dn,.day.today.sel .dn{background:var(--brand);color:#FFFFFF}
.msg.bot{background:var(--soft)}
.msg.me{background:var(--me);color:var(--ink)}
.tabbar [aria-current="page"]{color:var(--blue)}
.okline{display:flex;align-items:center;gap:6px;color:var(--ok);font-weight:600;margin-top:8px}
.okline.bad{color:var(--bad)}
.empsel{display:flex;align-items:center;gap:4px;background:var(--pill);border-radius:14px;padding-left:16px;min-height:48px;max-width:100%}
.empsel label{font-weight:700}

/* Minhas empresas */

/* Ícones que reagem ao passar o mouse, tocar ou clicar */
@keyframes spin360{to{transform:rotate(360deg)}}
@keyframes growbar{0%{transform:scaleY(.1)}65%{transform:scaleY(1.2)}100%{transform:scaleY(1)}}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-5px)}65%{transform:translateY(1px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}50%{transform:rotate(12deg)}80%{transform:rotate(-6deg)}}
@keyframes pulse{50%{transform:scale(1.22)}}
.ic-chart .bar{transform-box:fill-box;transform-origin:50% 100%}
:is(.nav a,.tabbar a,.sheetlinks a,.ib):is(:hover,:focus-visible) .ic-gear,.ic-gear.go{animation:spin360 .9s ease-in-out}
:is(.nav a,.tabbar a,.sheetlinks a,.ib):is(:hover,:focus-visible) .ic-chart .bar,.ic-chart.go .bar{animation:growbar .7s ease-out both}
.ic-chart .bar:nth-of-type(3){animation-delay:.1s!important}
.ic-chart .bar:nth-of-type(4){animation-delay:.2s!important}
:is(.nav a,.tabbar a,.sheetlinks a,.ib):is(:hover,:focus-visible) :is(.ic-home,.ic-building),:is(.ic-home,.ic-building).go{animation:hop .55s ease}
:is(.nav a,.tabbar a,.sheetlinks a,.ib):is(:hover,:focus-visible) :is(.ic-calendar,.ic-folder,.ic-bot,.ic-bell,.ic-phone),:is(.ic-calendar,.ic-folder,.ic-bot,.ic-bell,.ic-phone).go{animation:wiggle .6s ease}
:is(.nav a,.tabbar a,.sheetlinks a,.ib):is(:hover,:focus-visible) .ic-wallet,.ic-wallet.go{animation:pulse .5s ease}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.ic,.ic .bar{animation:none!important}}

/* ===== Refinamento visual (Impeccable) =====
   Mantém a identidade (menu azul-marinho, tema claro, roxo/azul) e corrige hierarquia, números, tabelas no celular e detalhes do navegador. */
:root{--ink-2:#39416A;--ease:cubic-bezier(.22,1,.36,1)}
::selection{background:#D8CFFF;color:var(--ink)}
*{scrollbar-width:thin;scrollbar-color:#C3C9E4 transparent}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
h1{letter-spacing:-.018em}
.pagehead h1{font-size:28px;line-height:1.15}
.num,.money,.kval{font-variant-numeric:tabular-nums}
.money{text-align:right!important;white-space:nowrap}

/* Cartões de indicadores: rótulo em cima, número grande sem quebrar */
.kpi{display:grid;grid-template-columns:40px minmax(0,1fr);grid-template-areas:"i l" "i s" "v v";column-gap:12px;row-gap:0;align-items:center;padding:18px 18px 16px}
.kpi>div{display:contents}
.kicon{grid-area:i;width:40px!important;height:40px!important;border-radius:12px!important}
.klabel{grid-area:l;font-size:13px;font-weight:600;color:var(--ink-2);align-self:end;line-height:1.25}
.ksub{grid-area:s;align-self:start;line-height:1.25}
.kval{grid-area:v;margin-top:14px;font-size:28px;line-height:1.1;letter-spacing:-.02em;white-space:nowrap;overflow:visible}
@container app (max-width:1040px){.kval{font-size:24px}}
@container app (max-width:560px){.kpi{padding:14px}.kval{font-size:22px;margin-top:12px}.klabel{font-size:12.5px}}

/* Tabelas: ações discretas, linha com destaque ao passar o mouse */
.tbl tbody tr{transition:background-color .15s var(--ease)}
.tbl tbody tr:hover td{background:#F8F9FE}
.tbl td .ib{width:36px!important;height:36px!important;border-color:transparent;background:transparent;color:var(--muted)}
.tbl td .ib:hover{background:var(--soft);color:var(--ink)}
.tbl td .ib[data-action="excluir"]:hover{background:var(--bad-bg);color:var(--bad)}
.linkbtn{font-weight:700}

/* Botões e abas: resposta ao toque/clique */
.btn,.ib,.nav a,.tabs button{transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease),transform .15s var(--ease)}
.btn:active,.ib:active{transform:translateY(1px)}

/* Tabelas no celular viram lista de cartões legíveis, sem rolagem lateral */
@container app (max-width:700px){
  .tablewrap{overflow:visible}
  .tbl.wide{min-width:0}
  .tbl thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .tbl,.tbl tbody{display:block;width:100%}
  .tbl tr{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t s" "v m" "a a";gap:6px 12px;padding:14px 2px;border-top:1px solid var(--line);align-items:center}
  .tbl td{display:block;padding:0;border:0!important;background:none!important}
  .tbl td.hide-n{display:none}
  .tbl td:nth-child(1){grid-area:t;font-size:15px}
  .tbl td:nth-child(3){grid-area:v;color:var(--muted)}
  .tbl td:nth-child(3)::before{content:"Vence em ";}
  .tbl td:nth-child(4){grid-area:m;font-size:15px;font-weight:700}
  .tbl td:nth-child(5){grid-area:s;justify-self:end}
  .tbl td:nth-child(6){grid-area:a}
  .tbl td:nth-child(6) .actions,.tbl td:nth-child(6)>div{justify-content:flex-start}
}

@media (max-width:820px){.authwrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}.authbrand{justify-content:flex-start}.authbrand{padding:24px 20px;gap:12px}.authbrand h2{font-size:24px}.authbrand ul{display:none}.authside{padding:20px 16px 32px;align-items:start}.authcard{padding:24px!important}}

function monthlyPaid(n){

/* ---------- gráfico de linha ---------- */
function lineChart(data){
  const W = 360, H = 190, pl = 52, pr = 16, pt = 22, pb = 28;
  const max = Math.max(1000, ...data.map(d => d.total));
  const steps = [500, 1000, 2000, 2500, 5000, 10000, 20000];
  let step = steps[steps.length - 1];
  for (let i = 0; i < steps.length; i++) { if (Math.ceil(max / steps[i]) <= 4) { step = steps[i]; break; } }
  const top = Math.ceil(max / step) * step;
  const X = i => pl + (W - pl - pr) * (data.length === 1 ? 0.5 : i / (data.length - 1));
  const Y = v => pt + (H - pt - pb) * (1 - v / top);
  let grid = '';
  for (let v = 0; v <= top; v += step) {
    grid += '<line class="gl" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text x="' + (pl - 8) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + (v === 0 ? '0' : (v / 1000).toLocaleString('pt-BR') + ' mil') + '</text>';
  }
  const pts = data.map((d, i) => X(i).toFixed(1) + ',' + Y(d.total).toFixed(1));
  const line = 'M' + pts.join(' L');
  const area = line + ' L' + X(data.length - 1).toFixed(1) + ',' + Y(0) + ' L' + X(0).toFixed(1) + ',' + Y(0) + ' Z';
  let dots = '', labs = '';
  data.forEach((d, i) => {
    const last = i === data.length - 1;
    dots += '<circle class="pt' + (last ? ' last' : '') + '" cx="' + X(i).toFixed(1) + '" cy="' + Y(d.total).toFixed(1) + '" r="' + (last ? 5 : 3.5) + '"><title>' + d.label + ': ' + esc(brl(d.total)) + '</title></circle>';
    labs += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + d.label + '</text>';
  });
  const lv = data[data.length - 1].total, lx = X(data.length - 1), ly = Math.max(14, Y(lv) - 16);
  const lt = 'R$ ' + Math.round(lv).toLocaleString('pt-BR');
  const tw = lt.length * 6.4 + 14;
  const tip = '<rect class="tip" x="' + (lx - tw + 8) + '" y="' + (ly - 12) + '" width="' + tw + '" height="20" rx="6"/><text class="tiptx" x="' + (lx - tw / 2 + 8) + '" y="' + (ly + 2) + '" text-anchor="middle">' + lt + '</text>';
  const alt = 'Pagamentos por mês: ' + data.map(d => d.label + ' ' + brl(d.total)).join('; ');
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(alt) + '">' + grid + '<path class="ar" d="' + area + '" opacity=".6"/><path class="ln" d="' + line + '"/>' + dots + labs + tip + '</svg>';
}

function answer(q){
  const n = norm(q), s = stats(), t = today();
  const lst = a => a.slice().sort(byVenc).map(o => '- ' + o.tributo + ', ' + fmtShort(o.venc) + ', ' + brl(o.valor)).join('\n');
  if (/\b(oi|ola|bom dia|boa tarde|boa noite)\b/.test(n)) return 'Olá! Posso falar sobre vencimentos da semana, atrasos, total pendente e pagamentos do mês.';
  if (/atras|vencid|pendenc/.test(n)) return s.atrasadas.length ? 'Há ' + s.atrasadas.length + (s.atrasadas.length === 1 ? ' obrigação atrasada' : ' obrigações atrasadas') + ':\n' + lst(s.atrasadas) + '\nRegularize o quanto antes e confirme com o contador se há multa e juros.' : 'Nenhuma obrigação atrasada nos dados cadastrados.';
  if (/semana|7 dias|proximos venc|proximo venc|quando venc|o que vence|vencimentos/.test(n)) {
    if (/proximo venc|quando venc/.test(n)) { const nx = s.abertas.filter(o => o.venc >= iso(t)).sort(byVenc)[0]; return nx ? 'O próximo vencimento é ' + nx.tributo + ' em ' + fmtDate(nx.venc) + ' (' + rel(nx.venc) + '), no valor de ' + brl(nx.valor) + '.' : 'Não há vencimentos futuros cadastrados.'; }
    return s.prox7.length ? 'Nos próximos 7 dias vencem:\n' + lst(s.prox7) : 'Nada vence nos próximos 7 dias, segundo os dados cadastrados.';
  }
  if (/total|quanto.*(pagar|devo|falta)|pendente|em aberto/.test(n)) return 'O total em aberto é ' + brl(s.totalPend) + ', em ' + s.abertas.length + (s.abertas.length === 1 ? ' obrigação.' : ' obrigações.');
  if (/paguei|pago|pagamentos/.test(n)) return 'Neste mês você registrou ' + brl(s.pagosMes) + ' em pagamentos.';
  if (/reforma|ibs|cbs/.test(n)) return 'Em 2026 a reforma tributária está em fase de teste (CBS 0,9% e IBS 0,1%) e a transição vai até 2033. As notas fiscais ganham campos novos. Confirme com o seu contador como isso afeta a sua empresa.';
  if (/\bdas\b|simples/.test(n)) return 'O DAS é a guia única do Simples Nacional. Aqui você acompanha vencimento e valor. A guia oficial vem da Receita (no futuro, pela integração). Confirme os valores com o seu contador.';
  if (/fgts/.test(n)) return 'O FGTS tem guia própria. No MVP você cadastra o vencimento e o valor manualmente.';
  if (/\biss\b/.test(n)) return 'O ISS é municipal e as regras e datas variam por cidade. Cadastre a data informada pela sua prefeitura.';
  return 'Ainda não sei responder isso no MVP. Posso falar de vencimentos, atrasos, total pendente e pagamentos do mês. Para outras dúvidas, fale com o seu contador.';
}

function pgRel(){
  const n = ui.relMeses, ms = monthlyPaid(n), keys = ms.map(m => m.key);

  const total = paid.reduce((s, o) => s + o.valor, 0), byT = {};
  paid.forEach(o => { byT[o.tributo] = (byT[o.tributo] || 0) + o.valor; });
  const arr = Object.keys(byT).map(k => [k, byT[k]]).sort((a, b) => b[1] - a[1]), mx = arr.length ? arr[0][1] : 1;
  const bars = arr.length ? '<div class="bars">' + arr.map(x => '<div class="barrow"><span>' + esc(x[0]) + '</span><div class="bar" aria-hidden="true"><i style="width:' + Math.max(4, Math.round(x[1] / mx * 100)) + '%"></i></div><span class="num">' + brl(x[1]) + '</span></div>').join('') + '</div>' : '<div class="empty"><p>Sem pagamentos no período.</p></div>';
  const rows = ms.slice().reverse().map(m => {
    const p = m.key.split('-'), open = obs().filter(o => !o.arquivado && !o.pagoEm && o.venc.slice(0, 7) === m.key).reduce((s, o) => s + o.valor, 0);

  return head('Relatórios', 'Quanto foi pago, por tributo e por mês.', sel) +
    '<div class="stats3"><div class="card"><div class="ksub">Total pago no período</div><div class="kval">' + brl(total) + '</div></div><div class="card"><div class="ksub">Pagamentos registrados</div><div class="kval">' + paid.length + '</div></div><div class="card"><div class="ksub">Média por mês</div><div class="kval">' + brl(total / n) + '</div></div></div>' +
    '<div class="cols">' + sec('rt', 'Pago por tributo', bars) + sec('rm', 'Mês a mês', '<div class="tablewrap"><table class="tbl"><thead><tr><th>Mês</th><th>Pago</th><th>Em aberto</th></tr></thead><tbody>' + rows + '</tbody></table></div>') + '</div>';
}

}

/* ===== Camada de API: troca o armazenamento local pelo servidor ===== */
const TK = 'fiscofacil-token';
let token = ''; try { token = localStorage.getItem(TK) || ''; } catch (e) {}
let INTEG_SRV = null;

async function api(method, url, body, isForm){
  const h = {}; if (token) h.authorization = 'Bearer ' + token;
  let payload;
  if (body !== undefined) { if (isForm) payload = body; else { h['content-type'] = 'application/json'; payload = JSON.stringify(body); } }
  let r;
  try { r = await fetch(url, {method, headers:h, body:payload}); } catch (e) { throw new Error('Sem conexão com o servidor.'); }
  if (r.status === 401 && token) { logout(); throw new Error('Sessão expirada. Entre novamente.'); }
  if (r.status === 204) return null;
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
  if (!r.ok) { const er = new Error((j && j.erro) || ('Erro ' + r.status)); er.status = r.status; er.data = j; throw er; }
  return j;
}
let SEM_LOGIN = false;
function logout(){
  token = ''; try { localStorage.removeItem(TK); } catch (e) {}
  // Limpa o que estava na memória da tela: outra pessoa pode entrar neste navegador.
  S = {v:1, user:{nome:''}, empresas:[], empresaId:null, obrigacoes:[], docs:[], alertas:[], lembretes:S.lembretes};
  [SIT, NOTAS, FIN].forEach(o => Object.keys(o).forEach(k => delete o[k]));
  showAuth(SEM_LOGIN ? 'inicio' : 'login');
}

  document.body.classList.toggle('semlogin', SEM_LOGIN);
  if (token) {
    // Sessão deslizante: renova o acesso a cada visita (o token dura 30 dias).
    try { const r = await api('POST', '/api/auth/renovar'); token = r.token; try { localStorage.setItem(TK, token); } catch (e) {} } catch (e) {}
    if (token) return iniciar();
  }
  showAuth(SEM_LOGIN ? 'inicio' : 'login');
}

addFiles = async function(files, tipo){
  const arr = Array.prototype.slice.call(files);
  const xmls = arr.filter(f => /\.xml$/i.test(f.name));
  if (xmls.length && xmls.length === arr.length) return importarXmls(xmls);
  if (arr.length === 1 && /\.pdf$/i.test(arr[0].name)) {
    try {
      const fd = new FormData(); fd.append('file', arr[0], arr[0].name);
      toast('Lendo o documento...');
      const r = await api('POST', '/api/empresas/' + S.empresaId + '/documentos/ler', fd, true);
      if (r.leitura.tipo !== 'desconhecido') { lerFile = arr[0]; ui.modal = {t:'lerdoc', r:r}; renderModal(); return; }
      toast('Não reconheci o documento. Ele foi enviado sem leitura.');
    } catch (er) { toast(er.message + ' O arquivo foi enviado sem leitura.'); }
  }
  let n = 0;
  try { for (const f of arr) { await enviar(S.empresaId, f, tipo); n++; } } catch (er) { falhou(er); }
  if (n) await refresh(n + (n === 1 ? ' documento enviado.' : ' documentos enviados.')); else renderMain();
};

const RE_REAIS = /R\$\s*-?\d[\d.]*(?:,\d{1,2})?/g, MASK = 'R$ ••••', orig = new Map();
function mascarar(raiz){
  if (!valoresOcultos) return;
  const w = document.createTreeWalker(raiz || document.body, NodeFilter.SHOW_TEXT);
  let n; const lote = [];
  while ((n = w.nextNode())) { const p = n.parentNode && n.parentNode.nodeName; if (p !== 'SCRIPT' && p !== 'STYLE' && RE_REAIS.test(n.nodeValue)) lote.push(n); RE_REAIS.lastIndex = 0; }
  lote.forEach(t => { orig.set(t, t.nodeValue); t.nodeValue = t.nodeValue.replace(RE_REAIS, MASK); });
}

    if (atr.length > 1) cards.push(cartao('', 'CRÍTICO', 'REGULARIZAR', (atr.length - 1) + (atr.length === 2 ? ' outra guia atrasada' : ' outras guias atrasadas'), 'Somam ' + brl(atr.slice(1).reduce((a, x) => a + x.valor, 0)) + '. Veja pagamento à vista ou parcelamento.', 'Ver como regularizar', 'regularizar'));
  }
  abert.filter(o => o.venc >= ti && diffDays(o.venc, t) <= 7).forEach(o => { const d = diffDays(o.venc, t); cards.push(cartao('warn', 'ATENÇÃO', d === 0 ? 'HOJE' : d === 1 ? 'AMANHÃ' : 'EM ' + d + ' DIAS', rotulo(o) + ' vence ' + fmtDate(o.venc), brl(o.valor) + '. Pague até o vencimento para evitar multa.', 'Pagar esta guia', 'abrir-pagamento', o.id)); });
  const NN = NOTAS[S.empresaId], aRec = NN ? NN.notas.filter(n => n.direcao === 'emitida' && n.receberEm && !n.recebidoEm).sort((x, y) => x.receberEm < y.receberEm ? -1 : 1) : [];
  const cli = n => n.contraparteNome || (n.contraparteDoc ? fmtDoc(n.contraparteDoc) : 'o cliente');
  aRec.filter(n => n.receberEm < ti).slice(0, 2).forEach(n => cards.push(cartao('warn', 'CONFIRME', 'PREVISTO ' + fmtDate(n.receberEm), 'Você recebeu ' + brl(n.valor) + '?', 'De ' + cli(n) + (n.numero ? ', nota nº ' + n.numero : '') + '. Se já caiu na conta, marque como recebido.', 'Já recebi', 'recebi', n.id)));
  aRec.filter(n => n.receberEm >= ti).slice(0, 2).forEach(n => { const d = diffDays(n.receberEm, t); cards.push(cartao('ok', 'A RECEBER', d === 0 ? 'HOJE' : d === 1 ? 'AMANHÃ' : 'EM ' + d + ' DIAS', 'Dia ' + fmtDate(n.receberEm) + ' você vai receber ' + brl(n.valor), 'De ' + cli(n) + (n.numero ? ', nota nº ' + n.numero : '') + '.', 'Já recebi', 'recebi', n.id)); });
  const proxima = abert.find(o => o.venc >= ti && diffDays(o.venc, t) > 7);
  if (proxima && cards.length < 5) cards.push(cartao('info', 'LEMBRETE', 'EM ' + diffDays(proxima.venc, t) + ' DIAS', rotulo(proxima) + ' vence ' + fmtDate(proxima.venc), brl(proxima.valor) + '. Ainda dá tempo.', 'Ver como pagar', 'abrir-pagamento', proxima.id));
  if (!st.L.length) cards.push('<div class="al info"><div class="t"><span>COMECE AQUI</span><span></span></div><b>Nenhuma guia registrada</b><span class="tx">Anexe o PDF da guia para o sistema acompanhar os vencimentos.</span></div>');
  const aviso = cards.length ? '<section class="card avisos" style="margin-top:20px"><div class="chead"><h2>Ações imediatas</h2></div><div class="alcards">' + cards.join('') + '</div></section>' : '';

  /* gráfico: uma barra por mês de competência do ano */
  const MES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const meses = MES.map((n, i) => ({n:n, i:i, g:[]}));
  st.L.forEach(o => { const c = comp(o.venc), mm = Number(c.slice(0, 2)) - 1, yy = Number(c.slice(3)); if (yy === ano && meses[mm]) meses[mm].g.push(o); });
  let nP = 0, nA = 0, nV = 0, maxV = 1;
  meses.forEach(m => { m.v = m.g.reduce((a, o) => a + o.valor, 0); maxV = Math.max(maxV, m.v);
    m.cls = !m.g.length ? 'vazio' : m.g.some(o => !o.pagoEm && o.venc < ti) ? 'bad' : m.g.some(o => !o.pagoEm) ? 'warn' : 'ok';
    if (m.cls === 'bad') nA += m.g.filter(o => !o.pagoEm && o.venc < ti).length; else if (m.cls === 'warn') nV += m.g.filter(o => !o.pagoEm).length; if (m.cls === 'ok') nP += m.g.length; });
  const mesAtual = t.getMonth();
  const barras = meses.map(m => { const h = m.v ? Math.max(8, Math.sqrt(m.v / maxV) * 140) : 6, alvo = m.g.find(o => !o.pagoEm) || m.g[0];
    const txt = m.v ? brl(m.v) : 'sem guia';
    const tit = MES[m.i] + ': ' + (m.v ? m.g.length + (m.g.length === 1 ? ' guia' : ' guias') + ', ' + brl(m.v) : 'nenhuma guia cadastrada');
    const inner = '<span class="bv">' + txt + '</span><i class="bar ' + m.cls + (m.i === mesAtual ? ' hoje' : '') + '" style="height:' + h + 'px"></i><em>' + m.n + '</em>';
    return alvo ? '<button class="bcol" data-action="abrir-pagamento" data-id="' + alvo.id + '" title="' + esc(tit) + '" aria-label="' + esc(tit) + '">' + inner + '</button>' : '<div class="bcol" title="' + esc(tit) + '">' + inner + '</div>'; }).join('');
  const grafico = '<section class="card" style="margin-top:20px"><div class="chead"><h2>Guias de ' + ano + ', mês a mês</h2></div><p class="sub" style="margin:0">Cada barra é um mês de competência. Clique em uma barra para ver como pagar.</p>' +
    '<div class="leg"><span><i class="d ok"></i>Paga ' + nP + '</span><span><i class="d bad"></i>Atrasada ' + nA + '</span><span><i class="d warn"></i>A vencer ' + nV + '</span><span><i class="d vazio"></i>Sem guia</span></div><div class="barras">' + barras + '</div></section>';

  /* linha do tempo: hoje + próximos vencimentos cadastrados */
  const itens = st.L.filter(o => o.venc >= ti).map(o => ({d:o.venc, o:o})).concat(aRec.filter(n => n.receberEm >= ti).map(n => ({d:n.receberEm, n:n}))).sort((x, y) => x.d < y.d ? -1 : 1).slice(0, 5);
  const futuras = itens;
  const quando = d => { const k = diffDays(d, t); return fmtDate(d) + ' · ' + (k === 0 ? 'hoje' : k === 1 ? 'amanhã' : 'em ' + k + ' dias'); };
  const pontos = ['<div class="pt ' + (atr.length ? 'bad' : 'ok') + '"><small>Hoje · ' + fmtDate(ti) + '</small><b>' + (atr.length ? atr.length + (atr.length === 1 ? ' guia atrasada' : ' guias atrasadas') : 'Nada atrasado') + '</b><span>' + (atr.length ? brl(atr.reduce((a, o) => a + o.valor, 0)) + ' em atraso' : 'Tudo em dia') + '</span></div>']
    .concat(itens.map(x => { if (x.n) return '<button class="pt rec" data-action="recebi" data-id="' + x.n.id + '" title="Clique para marcar como recebido"><small>' + quando(x.d) + '</small><b>Receber ' + brl(x.n.valor) + '</b><span>' + esc(cli(x.n)) + (x.n.numero ? ' · nota nº ' + esc(x.n.numero) : '') + '</span></button>';
      const o = x.o, d = diffDays(o.venc, t); return '<button class="pt ' + (o.pagoEm ? 'ok' : d <= 7 ? 'warn' : '') + '" data-action="abrir-pagamento" data-id="' + o.id + '"><small>' + quando(o.venc) + '</small><b>' + esc(rotulo(o)) + '</b><span>' + (o.pagoEm ? 'Já paga em ' + fmtDate(o.pagoEm) : brl(o.valor)) + '</span></button>'; }));
  const linha = '<section class="card" style="margin-top:20px"><div class="chead"><h2>O que vem a seguir</h2></div>' + (itens.length ? '' : '<p class="sub" style="margin:0 0 6px">Ainda não há guias nem recebimentos futuros cadastrados. Anexe as próximas guias e as notas de venda para elas aparecerem aqui.</p>') + '<div class="crono">' + pontos.join('') + '</div></section>';
  return aviso + grafico + linha;
}

ACT.recebi = rodar(async el => { await api('POST', '/api/notas/' + el.dataset.id + '/recebido'); await refresh('Recebimento registrado.'); });

route();
boot();
})();
</script>
